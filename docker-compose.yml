version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: auth-service
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - JWT_SECRET=my_super_secret_key_change_me
      - AUTH_DB_URL=postgres://postgres:postgres@postgres:5432/auth_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  product-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: product-service
    ports:
      - "8082:8082"
      - "50051:50051"
    environment:
      - PORT=8082
      - PRODUCT_DB_URL=postgres://postgres:postgres@postgres:5432/product_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: order-service
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - ORDER_DB_URL=postgres://postgres:postgres@postgres:5432/order_db?sslmode=disable
      - PRODUCT_GRPC_HOST=product-service:50051
    depends_on:
      postgres:
        condition: service_healthy
      product-service:
        condition: service_started

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: payment-service
    ports:
      - "8084:8084"
    environment:
      - PORT=8084
      - JWT_SECRET=my_super_secret_key_change_me
      - PAYMENT_DB_URL=postgres://postgres:postgres@postgres:5432/payment_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: api-gateway
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - JWT_SECRET=my_super_secret_key_change_me
      - AUTH_SERVICE_URL=http://auth-service:8081
      - PRODUCT_SERVICE_URL=http://product-service:8082
      - ORDER_SERVICE_URL=http://order-service:8083
      - PAYMENT_SERVICE_URL=http://payment-service:8084
    depends_on:
      - auth-service
      - product-service
      - order-service
      - payment-service

volumes:
  postgres_data:
